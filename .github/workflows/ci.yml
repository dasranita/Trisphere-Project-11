name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check api/index.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pricing/requirements.txt
      - run: cd pricing && pytest
