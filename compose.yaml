services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: localdemo
      POSTGRES_DB: tripsphere
    volumes:
      - data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d tripsphere']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:localdemo@db:5432/tripsphere
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:4000:4000']
  web:
    build: ./web
    ports: ['127.0.0.1:3000:3000']
  pricing:
    build: ./pricing
    ports: ['127.0.0.1:8000:8000']
volumes:
  data:
